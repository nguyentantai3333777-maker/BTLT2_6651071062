<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tạo form và các điều khiển</title>
    <script>
        function xuLyDongY() {
            document.getElementById("lblThongBao").innerText = "Bạn đã đăng ký thành công!!!";
        }
    </script>
</head>
<body>

    <form id="frmDangKyDuLich">
        <table border="1" bordercolor="#000000" bgcolor="#FFFFCC" cellspacing="0" cellpadding="4" align="center">
            <tr>
                <th colspan="2">
                    <h2><font color="#006699">Đăng ký du lịch</font></h2>
                </th>
            </tr>
            <tr>
                <td>Họ và tên</td>
                <td>
                    <input type="text" id="txtHoTen" name="txtHoTen" size="30">
                </td>
            </tr>
            <tr>
                <td>Địa chỉ</td>
                <td>
                    <input type="text" id="txtDiaChi" name="txtDiaChi" size="25">
                </td>
            </tr>
            <tr>
                <td>Điện thoại</td>
                <td>
                    <input type="text" id="txtDienThoai" name="txtDienThoai" size="15">
                </td>
            </tr>
            <tr>
                <td>Khách Việt Nam</td>
                <td>
                    <input type="checkbox" id="chkKhachVN" name="chkKhachVN">
                </td>
            </tr>
            <tr>
                <td>Chọn tour</td>
                <td>
                    <select id="cboTour" name="cboTour">
                        <optgroup label="Miền Bắc">
                            <option value="HN_HL_Sapa">Hà Nội - Hạ Long - Sapa</option>
                            <option value="HN_CH_NB">Hà Nội - Chùa Hương - Ninh Bình</option>
                            <option value="HN_CB_TC">Hà Nội - Cát Bà - Tuần Châu</option>
                        </optgroup>
                        <optgroup label="Miền Trung">
                            <option value="Hue_BM_DN">Huế - Bạch Mã - Đà Nẵng</option>
                            <option value="NT_DL">Nha Trang - Đà Lạt</option>
                            <option value="BMT_GL_KT">Buôn mê thuột - Gia lai - Kontum</option>
                        </optgroup>
                        <optgroup label="Miền Nam">
                            <option value="HCM_CT_CM">TP.HCM - Cần Thơ - Cà Mau</option>
                            <option value="HCM_MT">TP.HCM - Mỹ Tho</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Phương tiện</td>
                <td>
                    <input type="radio" id="rdMayBay" name="rdPhuongTien" value="MayBay"> Máy bay
                    <input type="radio" id="rdOTo" name="rdPhuongTien" value="OTo"> Xe ô tô
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <fieldset style="border: 1px solid #800000; width: 350px; height: 55px;">
                        <legend align="left" style="font-style: italic; color: #800000;">Số lượng đoàn khách</legend>
                        Người lớn <input type="text" id="txtNguoiLon" name="txtNguoiLon" size="3">
                        &nbsp;&nbsp;
                        Trẻ em <input type="text" id="txtTreEm" name="txtTreEm" size="3">
                    </fieldset>
                </td>
            </tr>
            <tr>
                <td>Ghi chú thêm</td>
                <td>
                    <textarea id="txtGhiChu" name="txtGhiChu" style="width:300px;" rows="3"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="button" id="btnDongY" value="Đồng ý" onclick="xuLyDongY()">
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <font color="red"><b><div id="lblThongBao"></div></b></font>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
